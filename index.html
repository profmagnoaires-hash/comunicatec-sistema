<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComunicaTec • Sistema Multiusuário</title>
<style>
:root{
  --primary:#176b3a;--primary2:#0f512c;--bg:#f4f6f8;--card:#fff;
  --text:#1f2937;--muted:#6b7280;--line:#d9dee5;
  --ok:#16834a;--warn:#b7791f;--danger:#b42318;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.topbar{background:var(--primary);color:white;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{font-weight:800;font-size:18px}.topbar small{opacity:.85}
.container{max-width:1180px;margin:28px auto;padding:0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.login{max-width:430px;margin:70px auto}
.login h1{text-align:center;font-size:25px}
.logo{width:70px;height:70px;border-radius:50%;background:#e9f4ed;margin:0 auto 15px;display:grid;place-items:center;font-size:35px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid #cbd2da;border-radius:9px;background:white}
textarea{min-height:100px;resize:vertical}
.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700}
.primary{background:var(--primary);color:white}.secondary{background:#eef2f5;color:#24313d}
.danger{background:#feeceb;color:var(--danger)}
.full{width:100%;margin-top:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:18px}.stat .num{font-size:28px;font-weight:800;margin-top:7px}
.muted{color:var(--muted)}.section{margin-top:18px}
table{width:100%;border-collapse:collapse;background:white}
th,td{border:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}
th{background:#eef0f2;font-size:13px}
.badge{display:inline-block;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:700}
.ok{background:#e7f6ed;color:#126b3c}.pending{background:#fff5db;color:#8a5a00}
.future{background:#edf2f7;color:#475569}
.toast{position:fixed;right:20px;bottom:20px;background:#1f2937;color:white;padding:13px 17px;border-radius:10px;display:none;z-index:20}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:18px;z-index:10}
.modal .card{width:min(680px,100%);max-height:90vh;overflow:auto}
.hidden{display:none!important}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tabs button.active{background:var(--primary);color:#fff}
.empty{padding:25px;text-align:center;color:var(--muted)}
.report-page{background:white;padding:30px;max-width:850px;margin:auto}
.report-head{text-align:center;font-size:12px;line-height:1.3}
.report-title{text-align:center;font-weight:800;font-size:16px;margin:25px 0 12px}
.sign{display:flex;justify-content:space-around;margin-top:70px;text-align:center;font-size:12px}
.sign div{width:40%;border-top:1px solid #555;padding-top:8px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.container{margin-top:18px}.topbar{padding:12px 15px}}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.actions .btn{width:100%}th,td{font-size:12px;padding:7px}}
@media print{body{background:white}.no-print{display:none!important}.report-page{box-shadow:none;border:0;margin:0;padding:12mm;max-width:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================
   COMUNICATEC - VERSÃO MULTIUSUÁRIO COM LOCALSTORAGE
   Dados salvos somente neste navegador/dispositivo.
   Perfis: ADMIN, COORDENADOR, INSTRUTOR, ALUNO
   ========================================================= */

const DB_KEY = "comunicatec_multi_v1";

const initialDB = {
  users: [
    {
      id:"u-admin",
      name:"Administrador",
      email:"admin@comunicatec.com",
      password:"123456",
      role:"ADMIN",
      func:"Administrador",
      phone:"",
      active:true
    },
    {
      id:"u-coord",
      name:"Prof. André Martins",
      email:"coordenador@comunicatec.com",
      password:"123456",
      role:"COORDENADOR",
      func:"Coordenador",
      phone:"",
      active:true
    },
    {
      id:"u-instrutor",
      name:"Prof. Magno Aires",
      email:"instrutor@comunicatec.com",
      password:"123456",
      role:"INSTRUTOR",
      func:"Instrutor",
      phone:"",
      active:true
    },
    {
      id:"u-aluno",
      name:"Aluno Demonstração",
      email:"aluno@comunicatec.com",
      password:"123456",
      role:"ALUNO",
      func:"Aluno",
      phone:"(96) 99999-9999",
      active:true
    }
  ],
  classes:[
    {
      id:"turma-santana",
      name:"Agência Santana",
      coordinatorId:"u-coord",
      instructorId:"u-instrutor",
      description:"Turma de demonstração do Projeto ComunicaTec",
      active:true
    }
  ],
  enrollments:[
    {userId:"u-aluno",classId:"turma-santana"}
  ],
  lessons:[
    {id:"a1",classId:"turma-santana",date:"2026-09-01",time:"19:00",hours:2,type:"Aula",title:"Aula / atividade do programa"},
    {id:"a2",classId:"turma-santana",date:"2026-09-04",time:"19:00",hours:2,type:"Aula",title:"Aula / atividade do programa"},
    {id:"a3",classId:"turma-santana",date:"2026-09-08",time:"19:00",hours:2,type:"Aula",title:"Aula / atividade do programa"},
    {id:"a4",classId:"turma-santana",date:"2026-09-11",time:"19:00",hours:2,type:"Aula",title:"Aula / atividade do programa"},
    {id:"a5",classId:"turma-santana",date:"2026-09-15",time:"19:00",hours:2,type:"Aula / atividade do programa"},
    {id:"a6",classId:"turma-santana",date:"2026-09-18",time:"19:00",hours:2,type:"Aula / atividade do programa"},
    {id:"a7",classId:"turma-santana",date:"2026-09-22",time:"19:00",hours:2,type:"Aula / atividade do programa"},
    {id:"a8",classId:"turma-santana",date:"2026-09-25",time:"19:00",hours:2,type:"Aula / atividade do programa"},
    {id:"a9",classId:"turma-santana",date:"2026-09-29",time:"19:00",hours:2,type:"Aula / atividade do programa"}
  ],
  activities:[],
  absences:[]
};

let db = loadDB();
let currentUserId = sessionStorage.getItem("ct_user_id") || null;

function loadDB(){
  try{
    const saved=localStorage.getItem(DB_KEY);
    const data=saved ? JSON.parse(saved) : structuredClone(initialDB);
    data.users ||= []; data.classes ||= []; data.enrollments ||= []; data.lessons ||= []; data.activities ||= []; data.absences ||= [];
    if(!data.users.some(u=>u.role==="INSTRUTOR")) data.users.push(structuredClone(initialDB.users.find(u=>u.role==="INSTRUTOR")));
    const demoClass=data.classes.find(c=>c.id==="turma-santana");
    if(demoClass && !demoClass.instructorId) demoClass.instructorId="u-instrutor";
    return data;
  }catch(e){
    return structuredClone(initialDB);
  }
}
function saveDB(){localStorage.setItem(DB_KEY,JSON.stringify(db))}
function uid(prefix="id"){return prefix+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmtDate(d){return new Date(d+"T12:00:00").toLocaleDateString("pt-BR")}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.style.display="block";
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>t.style.display="none",2500);
}
function currentUser(){return db.users.find(u=>u.id===currentUserId)||null}
function classIdsForUser(userId){
  return db.enrollments.filter(e=>e.userId===userId).map(e=>e.classId);
}
function classesForUser(userId){
  return db.classes.filter(c=>classIdsForUser(userId).includes(c.id));
}
function classesForInstructor(userId){
  return db.classes.filter(c=>c.instructorId===userId);
}
function classesForCoordinator(userId){
  return db.classes.filter(c=>c.coordinatorId===userId);
}
function studentsForClass(classId){
  const ids=db.enrollments.filter(e=>e.classId===classId).map(e=>e.userId);
  return db.users.filter(u=>u.role==="ALUNO"&&ids.includes(u.id)&&u.active);
}
function hasAbsence(lessonId,userId){
  return db.absences.some(a=>a.lessonId===lessonId&&a.userId===userId);
}
function userClass(userId){
  const ids=classIdsForUser(userId);
  return db.classes.find(c=>ids.includes(c.id))||null;
}
function roleLabel(r){
  return r==="ADMIN"?"Administrador":r==="COORDENADOR"?"Coordenador":r==="INSTRUTOR"?"Instrutor":"Aluno";
}
function render(){
  if(!currentUser()) return renderLogin();
  const u=currentUser();
  if(u.role==="ADMIN") renderAdmin();
  else if(u.role==="COORDENADOR") renderCoordinator();
  else if(u.role==="INSTRUTOR") renderInstructor();
  else renderStudent();
}

/* ================= LOGIN ================= */
function renderLogin(){
  document.getElementById("app").innerHTML=`
  <div class="container">
    <div class="card login">
      <div class="logo">🎓</div>
      <h1>Projeto ComunicaTec</h1>
      <p class="muted" style="text-align:center">Sistema de registro e acompanhamento de atividades</p>
      <label>E-mail</label>
      <input id="loginEmail" type="email" placeholder="Digite seu e-mail">
      <label>Senha</label>
      <input id="loginPassword" type="password" placeholder="Digite sua senha"
             onkeydown="if(event.key==='Enter') login()">
      <button class="btn primary full" onclick="login()">Entrar</button>
      <div class="card" style="margin-top:15px;background:#f8fafb">
        <b>Acessos de demonstração</b>
        <p style="margin:8px 0;font-size:13px">
          Administrador: admin@comunicatec.com / 123456<br>
          Coordenador: coordenador@comunicatec.com / 123456<br>
          Instrutor: instrutor@comunicatec.com / 123456<br>
          Aluno: aluno@comunicatec.com / 123456
        </p>
      </div>
    </div>
  </div>`;
}
function login(){
  const email=document.getElementById("loginEmail").value.trim().toLowerCase();
  const password=document.getElementById("loginPassword").value;
  const u=db.users.find(x=>x.email.toLowerCase()===email && x.password===password && x.active);
  if(!u){toast("E-mail, senha inválidos ou usuário inativo.");return}
  currentUserId=u.id;
  sessionStorage.setItem("ct_user_id",u.id);
  toast("Login realizado com sucesso.");
  render();
}
function logout(){
  currentUserId=null;
  sessionStorage.removeItem("ct_user_id");
  render();
}

/* ================= ADMIN ================= */
function renderAdmin(){
  const alunos=db.users.filter(u=>u.role==="ALUNO");
  const coords=db.users.filter(u=>u.role==="COORDENADOR");
  const totalHours=db.activities.reduce((s,a)=>s+Number(a.hours||0),0);

  document.getElementById("app").innerHTML=`
  <div class="topbar">
    <div><div class="brand">COMUNICATEC</div><small>Painel do Administrador</small></div>
    <button class="btn secondary" onclick="logout()">Sair</button>
  </div>
  <div class="container">
    <div style="display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap">
      <div><h1>Olá, ${esc(currentUser().name)}!</h1><p class="muted">Gerencie usuários, turmas, aulas e atividades.</p></div>
      <div class="actions">
        <button class="btn primary" onclick="openUserModal()">+ Novo usuário</button>
        <button class="btn secondary" onclick="openClassModal()">+ Nova turma</button>
        <button class="btn secondary" onclick="openBackupModal()">Backup</button>
      </div>
    </div>

    <div class="grid section">
      <div class="card stat"><div class="muted">Usuários</div><div class="num">${db.users.length}</div></div>
      <div class="card stat"><div class="muted">Alunos</div><div class="num">${alunos.length}</div></div>
      <div class="card stat"><div class="muted">Turmas</div><div class="num">${db.classes.length}</div></div>
      <div class="card stat"><div class="muted">Horas registradas</div><div class="num">${totalHours}h</div></div>
    </div>

    <div class="tabs">
      <button id="tabUsers" class="btn primary active" onclick="adminTab('users')">Usuários</button>
      <button id="tabClasses" class="btn secondary" onclick="adminTab('classes')">Turmas</button>
      <button id="tabLessons" class="btn secondary" onclick="adminTab('lessons')">Aulas</button>
      <button id="tabActivities" class="btn secondary" onclick="adminTab('activities')">Atividades</button>
      <button id="tabReports" class="btn secondary" onclick="adminTab('reports')">Relatórios</button>
    </div>

    <div id="adminContent"></div>
  </div>`;
  adminTab("users");
}
function adminTab(tab){
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
  const el=document.getElementById("tab"+tab.charAt(0).toUpperCase()+tab.slice(1));
  if(el) el.classList.add("active");
  const c=document.getElementById("adminContent");

  if(tab==="users"){
    c.innerHTML=`<div class="card"><h2>Usuários cadastrados</h2>
      <div style="overflow:auto"><table>
      <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Turma</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>${db.users.map(u=>{
        const cls=userClass(u.id);
        return `<tr>
          <td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${roleLabel(u.role)}</td>
          <td>${esc(cls?.name||"—")}</td>
          <td><span class="badge ${u.active?"ok":"pending"}">${u.active?"Ativo":"Inativo"}</span></td>
          <td><div class="actions">
            <button class="btn secondary" onclick="openUserModal('${u.id}')">Editar</button>
            <button class="btn ${u.active?"danger":"primary"}" onclick="toggleUser('${u.id}')">${u.active?"Desativar":"Ativar"}</button>
          </div></td>
        </tr>`}).join("")}</tbody></table></div></div>`;
  }

  if(tab==="classes"){
    c.innerHTML=`<div class="card"><h2>Turmas / Agências</h2>
      <div style="overflow:auto"><table>
      <thead><tr><th>Nome</th><th>Coordenador</th><th>Instrutor</th><th>Alunos</th><th>Status</th><th>Ações</th></tr></thead>
      <tbody>${db.classes.map(cl=>{
        const co=db.users.find(u=>u.id===cl.coordinatorId);
        const ins=db.users.find(u=>u.id===cl.instructorId);
        const qtd=db.enrollments.filter(e=>e.classId===cl.id).length;
        return `<tr><td>${esc(cl.name)}</td><td>${esc(co?.name||"—")}</td><td>${esc(ins?.name||"—")}</td><td>${qtd}</td>
        <td><span class="badge ${cl.active?"ok":"pending"}">${cl.active?"Ativa":"Inativa"}</span></td>
        <td><div class="actions">
          <button class="btn secondary" onclick="openClassModal('${cl.id}')">Editar</button>
          <button class="btn primary" onclick="manageEnrollments('${cl.id}')">Alunos</button>
        </div></td></tr>`}).join("")}</tbody></table></div></div>`;
  }

  if(tab==="lessons"){
    c.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
      <h2>Aulas programadas</h2><button class="btn primary" onclick="openLessonModal()">+ Nova aula</button></div>
      <div style="overflow:auto"><table><thead><tr><th>Data</th><th>Horário</th><th>Turma</th><th>Carga</th><th>Tipo</th><th>Ações</th></tr></thead>
      <tbody>${db.lessons.sort((a,b)=>a.date.localeCompare(b.date)).map(l=>{
        const cl=db.classes.find(c=>c.id===l.classId);
        return `<tr><td>${fmtDate(l.date)}</td><td>${esc(l.time)}</td><td>${esc(cl?.name||"—")}</td><td>${l.hours}h</td><td>${esc(l.type)}</td>
        <td><div class="actions"><button class="btn secondary" onclick="openLessonModal('${l.id}')">Editar</button>
        <button class="btn danger" onclick="deleteLesson('${l.id}')">Excluir</button></div></td></tr>`}).join("")}</tbody></table></div></div>`;
  }

  if(tab==="activities"){
    c.innerHTML=`<div class="card"><h2>Todas as atividades</h2>
      <div style="overflow:auto"><table><thead><tr><th>Aluno</th><th>Data</th><th>Aula</th><th>Horas</th><th>Atividade</th><th>Status</th></tr></thead>
      <tbody>${db.activities.length?db.activities.map(a=>{
        const u=db.users.find(x=>x.id===a.userId), l=db.lessons.find(x=>x.id===a.lessonId);
        return `<tr><td>${esc(u?.name||"—")}</td><td>${fmtDate(l?.date||a.date)}</td><td>${esc(l?.title||"—")}</td>
        <td>${a.hours}h</td><td>${esc(a.description)}</td><td><span class="badge ${a.status==="APROVADA"?"ok":"pending"}">${esc(a.status)}</span></td></tr>`;
      }).join(""):`<tr><td colspan="6" class="empty">Nenhuma atividade registrada.</td></tr>`}</tbody></table></div></div>`;
  }

  if(tab==="reports"){
    c.innerHTML=`<div class="card"><h2>Relatórios</h2><p class="muted">Selecione um aluno para visualizar o relatório individual.</p>
      <div style="overflow:auto"><table><thead><tr><th>Aluno</th><th>Turma</th><th>Atividades</th><th>Horas</th><th></th></tr></thead>
      <tbody>${db.users.filter(u=>u.role==="ALUNO").map(u=>{
        const acts=db.activities.filter(a=>a.userId===u.id);
        const h=acts.reduce((s,a)=>s+Number(a.hours||0),0);
        return `<tr><td>${esc(u.name)}</td><td>${esc(userClass(u.id)?.name||"—")}</td><td>${acts.length}</td><td>${h}h</td>
        <td><button class="btn primary" onclick="openStudentReport('${u.id}')">Visualizar relatório</button></td></tr>`;
      }).join("")}</tbody></table></div></div>`;
  }
}

/* ================= COORDENADOR ================= */
function renderCoordinator(){
  const u=currentUser();
  const classes=classesForCoordinator(u.id);
  const students=db.users.filter(x=>x.role==="ALUNO" && classIdsForUser(x.id).some(id=>classes.map(c=>c.id).includes(id)));
  const acts=db.activities.filter(a=>students.some(s=>s.id===a.userId));

  document.getElementById("app").innerHTML=`
  <div class="topbar"><div><div class="brand">COMUNICATEC</div><small>Painel do Coordenador</small></div>
  <button class="btn secondary" onclick="logout()">Sair</button></div>
  <div class="container">
    <div><h1>Olá, ${esc(u.name)}!</h1><p class="muted">Acompanhamento dos alunos vinculados à sua coordenação.</p></div>
    <div class="grid section">
      <div class="card stat"><div class="muted">Turmas</div><div class="num">${classes.length}</div></div>
      <div class="card stat"><div class="muted">Alunos</div><div class="num">${students.length}</div></div>
      <div class="card stat"><div class="muted">Atividades</div><div class="num">${acts.length}</div></div>
      <div class="card stat"><div class="muted">Horas</div><div class="num">${acts.reduce((s,a)=>s+Number(a.hours||0),0)}h</div></div>
    </div>
    <div class="card section"><h2>Meus alunos</h2>
      <div style="overflow:auto"><table><thead><tr><th>Aluno</th><th>E-mail</th><th>Turma</th><th>Atividades</th><th>Horas</th><th></th></tr></thead>
      <tbody>${students.length?students.map(s=>{
        const aa=db.activities.filter(a=>a.userId===s.id);
        return `<tr><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${esc(userClass(s.id)?.name||"—")}</td>
        <td>${aa.length}</td><td>${aa.reduce((x,a)=>x+Number(a.hours||0),0)}h</td>
        <td><button class="btn primary" onclick="openStudentReport('${s.id}')">Relatório</button></td></tr>`;
      }).join(""):`<tr><td colspan="6" class="empty">Nenhum aluno vinculado.</td></tr>`}</tbody></table></div>
    </div>
  </div>`;
}

/* ================= INSTRUTOR ================= */
function renderInstructor(){
  const u=currentUser();
  const classes=classesForInstructor(u.id);
  const students=db.users.filter(s=>s.role==="ALUNO"&&s.active&&classIdsForUser(s.id).some(cid=>classes.some(c=>c.id===cid)));
  const acts=db.activities.filter(a=>students.some(s=>s.id===a.userId));
  const abs=db.absences.filter(a=>students.some(s=>s.id===a.userId));
  document.getElementById("app").innerHTML=`
  <div class="topbar"><div><div class="brand">COMUNICATEC</div><small>Painel do Instrutor</small></div><button class="btn secondary" onclick="logout()">Sair</button></div>
  <div class="container">
    <div><h1>Olá, ${esc(u.name)}!</h1><p class="muted">Responsável pelas atividades e frequência das turmas atribuídas a você.</p></div>
    <div class="grid section">
      <div class="card stat"><div class="muted">Minhas turmas</div><div class="num">${classes.length}</div></div>
      <div class="card stat"><div class="muted">Alunos</div><div class="num">${students.length}</div></div>
      <div class="card stat"><div class="muted">Atividades</div><div class="num">${acts.length}</div></div>
      <div class="card stat"><div class="muted">Ausências</div><div class="num">${abs.length}</div></div>
    </div>
    <div class="card section"><h2>Alunos das minhas turmas</h2>
      <div style="overflow:auto"><table><thead><tr><th>Aluno</th><th>Turma</th><th>Atividades</th><th>Ausências</th><th>Ação</th></tr></thead><tbody>

function openAttendance(classId,userId){
  const u=currentUser(), cl=db.classes.find(c=>c.id===classId), st=db.users.find(x=>x.id===userId);
  if(!u||u.role!=="INSTRUTOR"||!cl||cl.instructorId!==u.id||!st)return;
  const lessons=db.lessons.filter(l=>l.classId===classId).sort((a,b)=>a.date.localeCompare(b.date));
  document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="modal"><div class="card"><h2>Frequência — ${esc(st.name)}</h2><p class="muted">${esc(cl.name)}</p>${lessons.map(l=>`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee"><span><b>${fmtDate(l.date)}</b> — ${esc(l.title||"Aula")}</span><button class="btn ${hasAbsence(l.id,userId)?"secondary":"danger"}" onclick="toggleAbsence('${l.id}','${userId}');closeModal();openAttendance('${classId}','${userId}')">${hasAbsence(l.id,userId)?"Desmarcar ausência":"Registrar ausência"}</button></div>`).join("")||`<p class="empty">Nenhuma aula cadastrada.</p>`}<div class="actions" style="margin-top:15px"><button class="btn secondary" onclick="closeModal()">Fechar</button></div></div></div>`);
}
function toggleAbsence(lessonId,userId){
  const u=currentUser(), lesson=db.lessons.find(l=>l.id===lessonId);
  if(!u||u.role!=="INSTRUTOR"||!lesson||!db.classes.some(c=>c.id===lesson.classId&&c.instructorId===u.id)){toast("Acesso não permitido.");return}
  const i=db.absences.findIndex(a=>a.lessonId===lessonId&&a.userId===userId);
  if(i>=0) db.absences.splice(i,1); else db.absences.push({id:uid("abs"),lessonId,userId,markedBy:u.id,createdAt:new Date().toISOString()});
  saveDB();toast(i>=0?"Ausência desmarcada.":"Ausência registrada.");
  if(document.getElementById("app")) renderInstructor();
}

/* ================= ATIVIDADE ================= */
function openActivity(lessonId){
  const u=currentUser();
  const lesson=db.lessons.find(l=>l.id===lessonId);
  if(!lesson || u.role!=="ALUNO") return;
  if(!classIdsForUser(u.id).includes(lesson.classId)){toast("Acesso não permitido.");return}
  const old=db.activities.find(a=>a.userId===u.id&&a.lessonId===lessonId);
  if(old){toast("Esta atividade já foi registrada e não pode mais ser editada.");return}
  document.body.insertAdjacentHTML("beforeend",`
  <div class="modal" id="modal"><div class="card">
    <h2>Registrar atividade</h2>
    <p><b>Data:</b> ${fmtDate(lesson.date)} &nbsp; <b>Horário:</b> ${esc(lesson.time)} &nbsp; <b>Carga:</b> ${lesson.hours}h</p>
    <label>Atividade desenvolvida</label>
    <textarea id="activityDesc" placeholder="Descreva de forma objetiva as atividades realizadas..."></textarea>
    <div class="actions" style="margin-top:15px">
      <button class="btn primary" onclick="saveActivity('${lessonId}')">Salvar atividade</button>
      <button class="btn secondary" onclick="closeModal()">Cancelar</button>
    </div>
  </div></div>`);
}
function saveActivity(lessonId){
  const u=currentUser(), lesson=db.lessons.find(l=>l.id===lessonId);
  if(!u||u.role!=="ALUNO"||!lesson||!classIdsForUser(u.id).includes(lesson.classId)){toast("Acesso não permitido.");return}
  if(db.activities.some(a=>a.userId===u.id&&a.lessonId===lessonId)){toast("Esta atividade já foi registrada e não pode mais ser alterada.");closeModal();renderStudent();return}
  const desc=document.getElementById("activityDesc").value.trim();
  if(!desc){toast("Descreva a atividade antes de salvar.");return}
  db.activities.push({id:uid("act"),userId:u.id,lessonId,description:desc,hours:Number(lesson.hours),status:"PENDENTE",createdAt:new Date().toISOString()});
  saveDB();closeModal();toast("Atividade registrada com sucesso.");renderStudent();
}

function updateUserClassField(){
  const role=document.getElementById("uRole").value;
  document.getElementById("userClassField").style.display=role==="ALUNO"?"block":"none";
}
function saveUser(id){
  const name=document.getElementById("uName").value.trim();
  const email=document.getElementById("uEmail").value.trim().toLowerCase();
  const role=document.getElementById("uRole").value;
  const password=document.getElementById("uPassword").value;
  if(!name||!email){toast("Nome e e-mail são obrigatórios.");return}
  const duplicate=db.users.find(x=>x.email.toLowerCase()===email&&x.id!==id);
  if(duplicate){toast("Este e-mail já está cadastrado.");return}
  if(!id && !password){toast("Informe uma senha para o novo usuário.");return}
  let u=id?db.users.find(x=>x.id===id):{id:uid("user"),active:true};
  u.name=name;u.email=email;u.role=role;u.func=document.getElementById("uFunc").value.trim();u.phone=document.getElementById("uPhone").value.trim();
  if(password)u.password=password;
  if(!id)db.users.push(u);

  db.enrollments=db.enrollments.filter(e=>e.userId!==u.id);
  if(role==="ALUNO"){
    const cid=document.getElementById("uClass")?.value;
    if(cid)db.enrollments.push({userId:u.id,classId:cid});
  }
  saveDB();closeModal();toast("Usuário salvo.");renderAdmin();adminTab("users");
}
function toggleUser(id){
  const u=db.users.find(x=>x.id===id);
  if(!u)return;
  u.active=!u.active;saveDB();toast(u.active?"Usuário ativado.":"Usuário desativado.");adminTab("users");
}

      <button class="btn primary" onclick="exportBackup()">Exportar backup</button>
      <button class="btn secondary" onclick="document.getElementById('backupFile').click()">Importar backup</button>
      <input id="backupFile" type="file" accept=".json" style="display:none" onchange="importBackup(event)">
      <button class="btn secondary" onclick="closeModal()">Fechar</button>
    </div>
    <p style="font-size:12px;color:#b42318;margin-top:15px">
      Atenção: este protótipo usa localStorage. Os dados não ficam em um servidor.
    </p>
  </div></div>`);
}
function exportBackup(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="backup-comunicatec-"+new Date().toISOString().slice(0,10)+".json";
  a.click();URL.revokeObjectURL(a.href);
  toast("Backup exportado.");
}
function importBackup(event){
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!data.users||!data.classes||!data.lessons||!data.activities||!data.enrollments)throw new Error();
      data.absences ||= [];
      db=data;saveDB();closeModal();currentUserId=null;sessionStorage.removeItem("ct_user_id");
      toast("Backup importado com sucesso.");render();
    }catch(e){toast("Arquivo de backup inválido.")}
  };
  reader.readAsText(file);
}

/* ================= UTILITÁRIOS ================= */
function closeModal(){document.getElementById("modal")?.remove()}

window.addEventListener("storage",()=>{
  db=loadDB();
  if(currentUser())render();
});

render();
</script>
</body>
</html>
