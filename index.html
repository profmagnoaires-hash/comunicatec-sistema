<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COMUNICATEC • Sistema Multiusuário</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary:#176b3a;
  --primary2:#0f512c;
  --secondary:#2563eb;
  --danger:#dc2626;
  --warning:#d97706;
  --success:#15803d;
  --bg:#f4f6f8;
  --card:#fff;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
  --shadow:0 4px 18px rgba(0,0,0,.07);
  --radius:14px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

#loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.96);
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:15px;
}

.spinner{
  width:42px;
  height:42px;
  border:4px solid #ddd;
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* LOGIN */

#loginScreen{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    linear-gradient(135deg,#0f512c,#176b3a);
}

.login-card{
  width:100%;
  max-width:430px;
  background:white;
  padding:35px;
  border-radius:20px;
  box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.logo{
  width:75px;
  height:75px;
  border-radius:18px;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 20px;
  font-size:34px;
  font-weight:bold;
}

.login-card h1{
  text-align:center;
  margin:0 0 5px;
}

.login-card p{
  text-align:center;
  color:var(--muted);
  margin-bottom:28px;
}
.btn-link{
  border:0;
  background:transparent;
  color:var(--secondary);
  padding:0;
  font-size:13px;
  cursor:pointer;
  font-weight:bold;
}
.btn-link:hover{text-decoration:underline}

.auth-note{
  padding:12px;
  border-radius:9px;
  background:#eff6ff;
  color:#1e40af;
  font-size:14px;
  margin-bottom:16px;
  line-height:1.45;
}

.auth-note.warning{
  background:#fff7ed;
  color:#9a3412;
}

.auth-back{
  width:100%;
  margin-top:10px;
}

/* APP */

#app{
  min-height:100vh;
}

.topbar{
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:100;
}

.topbar-inner{
  max-width:1400px;
  margin:auto;
  min-height:72px;
  padding:10px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-icon{
  width:48px;
  height:48px;
  background:var(--primary);
  color:white;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.brand h1{
  font-size:18px;
  margin:0;
}

.brand small{
  color:var(--muted);
}

.user-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--primary);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.layout{
  max-width:1400px;
  margin:auto;
  padding:20px;
}

.nav{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:20px;
  padding-bottom:4px;
}

.nav button{
  border:1px solid var(--border);
  background:white;
  padding:10px 15px;
  border-radius:10px;

}

.nav button.active{
  background:var(--primary);
  color:white;

}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

.page-title h2{
  margin:0;
}

/* CARDS */

.grid{
  display:grid;
  gap:16px;
}

.grid-2{
  grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid-3{
  grid-template-columns:repeat(3,minmax(0,1fr));
}

.grid-4{
  grid-template-columns:repeat(4,minmax(0,1fr));
}

.card{
  background:white;
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
}

.stat{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.stat-number{
  font-size:30px;
  font-weight:bold;
  color:var(--primary);
}

.stat-label{
  color:var(--muted);
  font-size:14px;
}

.icon-box{
  width:48px;
  height:48px;
  border-radius:12px;
  background:#e9f5ee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

/* FORM */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  font-weight:bold;
  font-size:14px;
}

input,
select,
textarea{
  width:100%;
  padding:11px 12px;
  border:1px solid #d1d5db;
  border-radius:9px;
  background:#fff;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px rgba(23,107,58,.1);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:18px;
  flex-wrap:wrap;
}

/* BUTTONS */

.btn{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  font-weight:bold;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
}

.btn-primary{
  background:var(--primary);
  color:#fff;
}

.btn-primary:hover{
  background:var(--primary2);
}

.btn-secondary{
  background:#eef2f7;
  color:var(--text);
}

.btn-danger{
  background:var(--danger);
  color:white;
}

.btn-warning{
  background:var(--warning);
  color:white;
}

.btn-success{
  background:var(--success);
  color:white;
}

.btn-sm{
  padding:7px 10px;
  font-size:13px;
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;

/* TABLE */

.table-wrap{
  width:100%;
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  border-bottom:1px solid var(--border);
  padding:11px;
  text-align:left;
  vertical-align:middle;
}

th{
  background:#f8fafc;
  font-size:13px;
}

.badge{
  display:inline-flex;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:bold;
}

.badge-green{
  background:#dcfce7;
  color:#166534;
}

.badge-red{
  background:#fee2e2;
  color:#991b1b;
}

.badge-blue{
  background:#dbeafe;
  color:#1e40af;
}

.badge-yellow{
  background:#fef3c7;
  color:#92400e;
}

.badge-gray{
  background:#f3f4f6;
  color:#374151;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:5000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-card{
  background:#fff;
  width:100%;
  max-width:720px;
  max-height:90vh;
  overflow:auto;
  border-radius:16px;
  padding:25px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.modal-header h3{
  margin:0;
}

/* TOAST */

#toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:10000;
  max-width:400px;
}

.toast{
  background:#111827;
  color:#fff;
  padding:14px 18px;
  border-radius:10px;
  margin-top:8px;
  box-shadow:var(--shadow);
}

.toast.success{
  background:#166534;
}

.toast.error{
  background:#991b1b;
}

/* REPORT */

.report-page{
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:var(--shadow);
}

.report-header{
  border-bottom:2px solid var(--primary);
  padding-bottom:15px;
  margin-bottom:20px;
}

.report-header h1{
  color:var(--primary);
  margin:0 0 5px;
}

.report-section{
  margin:25px 0;
}

.report-section h3{
  color:var(--primary);
  border-bottom:1px solid var(--border);
  padding-bottom:8px;
}

.report-total{
  font-size:25px;
  font-weight:bold;
  color:var(--primary);
}

/* ATTENDANCE */

.attendance-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:12px;
  border-bottom:1px solid var(--border);
}

.attendance-status{
  min-width:100px;
  text-align:center;
}

/* EMPTY */

.empty{
  padding:35px;
  text-align:center;
  color:var(--muted);
}

/* MOBILE */

@media(max-width:900px){
  .grid-4{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .grid-3{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:650px){
  .topbar-inner{
    align-items:flex-start;
  }

  .user-area .user-info{
    display:none;
  }

  .grid-2,
  .grid-3,
  .grid-4,
  .form-grid{
    grid-template-columns:1fr;
  }

  .layout{
    padding:12px;
  }

  .card{
    padding:15px;
  }

  .report-page{
    padding:15px;
  }

  .table-wrap{
    font-size:13px;
  }
}

@media print{
  body{
    background:white;
  }

  .topbar,
  .nav,
  .page-title,
  .no-print{
    display:none!important;
  }

  .layout{
    padding:0;
  }

  .report-page{
    box-shadow:none;
    padding:0;
  }
}
</style>

<script>
/* =========================================================
   CONFIGURAÇÃO SUPABASE
   ========================================================= */

const SUPABASE_URL = "const SUPABASE_URL = "https://qnjsaihbtkxsxxypromd.supabase.co";";
const SUPABASE_ANON_KEY = "sb_publishable_CeuPoXsuZSMkLl5HBVUOzQ_SQPxIb7V";

if(
  SUPABASE_URL.includes("COLE_SUA") ||
  SUPABASE_ANON_KEY.includes("COLE_SUA")
){
  console.warn(
    "Configure SUPABASE_URL e SUPABASE_ANON_KEY antes de usar o sistema."
  );
}

const { createClient } = window.supabase;

const supabaseClient = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


/* =========================================================
   ESTADO
   ========================================================= */

let session = null;
let currentProfile = null;

let db = {
  profiles:[],
  turmas:[],
  matriculas:[],
  aulas:[],
  atividades:[],
  frequencias:[]
};

let currentPage = "inicio";


/* =========================================================
   UTILITÁRIOS
   ========================================================= */

function escapeHtml(value){
  if(value === null || value === undefined) return "";

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function formatDate(date){
  if(!date) return "-";

  const [y,m,d] = String(date).split("-");

  if(!y || !m || !d) return date;

  return `${d}/${m}/${y}`;
}

function formatTime(time){
  if(!time) return "-";

  return String(time).substring(0,5);
}

function todayISO(){
  return new Date().toISOString().split("T")[0];
}

function roleLabel(role){

  const map = {
    ADMIN:"Administrador",
    COORDENADOR:"Coordenador",
    INSTRUTOR:"Instrutor",
    ALUNO:"Aluno"
  };

  return map[role] || role || "-";
}

function initials(name){

  if(!name) return "U";

  return name
    .split(" ")
    .filter(Boolean)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();
}

function showToast(message,type=""){
  const container = document.getElementById("toast");

  const div = document.createElement("div");

  div.className = `toast ${type}`;

  div.textContent = message;

  container.appendChild(div);

  setTimeout(()=>{
    div.remove();
  },4000);
}

function showLoading(show=true){
  document.getElementById("loading").classList.toggle("hidden",!show);
}

function calculateHours(aula){

  if(!aula) return 0;

  if(!aula.hora_inicio || !aula.hora_fim){
    return 0;
  }

  const [h1,m1] = aula.hora_inicio.split(":").map(Number);
  const [h2,m2] = aula.hora_fim.split(":").map(Number);

  let start = h1 * 60 + m1;
  let end = h2 * 60 + m2;

  if(end < start){
    end += 24 * 60;
  }

  return Number(((end-start)/60).toFixed(2));
}

function getProfile(id){
  return db.profiles.find(x => x.id === id);
}

function getTurma(id){
  return db.turmas.find(x => String(x.id) === String(id));
}

function getAula(id){
  return db.aulas.find(x => String(x.id) === String(id));
}

function getAluno(id){
  return getProfile(id);
}

function getMatriculasDaTurma(turmaId){
  return db.matriculas.filter(x =>
    String(x.turma_id) === String(turmaId) &&
    x.ativo !== false
  );
}

function getTurmaDoAluno(alunoId){

  const matricula = db.matriculas.find(x =>
    x.aluno_id === alunoId &&
    x.ativo !== false
  );

  if(!matricula) return null;

  return getTurma(matricula.turma_id);
}

function userIsAdmin(){
  return currentProfile?.perfil === "ADMIN";
}

function userIsCoordinator(){
  return currentProfile?.perfil === "COORDENADOR";
}

function userIsInstructor(){
  return currentProfile?.perfil === "INSTRUTOR";
}

function userIsStudent(){
  return currentProfile?.perfil === "ALUNO";
}


/* =========================================================
   AUTENTICAÇÃO
   ========================================================= */

function publicRedirectUrl(){
  /*
   * Usa a URL atual do GitHub Pages (ou outro domínio publicado).
   * No Supabase, essa URL precisa estar cadastrada em:
   * Authentication > URL Configuration > Redirect URLs.
   */
  return window.location.origin + window.location.pathname;
}

function showLogin(){
  const screen = document.getElementById("loginScreen");
  screen.classList.remove("hidden");
  document.getElementById("app").classList.add("hidden");

  document.getElementById("authSubtitle").textContent =
    "Sistema de Gestão de Alunos";

  document.getElementById("authContent").innerHTML = `
    <form id="loginForm">

      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="loginEmail" required
          autocomplete="username" placeholder="seu@email.com">
      </div>

      <br>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="loginPassword" required
          autocomplete="current-password" placeholder="Digite sua senha">
      </div>

      <div style="text-align:right;margin-top:8px">
        <button type="button" class="btn-link" onclick="showForgotPassword()">
          Esqueci minha senha
        </button>
      </div>

      <br>

      <button class="btn btn-primary" style="width:100%">
        🔐 Entrar no sistema
      </button>

      <button type="button" class="btn btn-secondary"
        style="width:100%;margin-top:10px" onclick="showSignup()">
        📝 Cadastrar novo usuário
      </button>

    </form>
  `;

  document.getElementById("loginForm")
    .addEventListener("submit", handleLoginSubmit);
}

async function handleLoginSubmit(event){
  event.preventDefault();

  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;

  try{
    showLoading(true);
    await login(email,password);
  }catch(error){
    console.error(error);
    showToast(
      error.message || "E-mail ou senha inválidos.",
      "error"
    );
  }finally{
    showLoading(false);
  }
}

function showForgotPassword(){
  document.getElementById("authSubtitle").textContent =
    "Recuperação de senha";

  document.getElementById("authContent").innerHTML = `
    <div class="auth-note">
      Informe o e-mail cadastrado. Enviaremos um link para você criar
      uma nova senha.
    </div>

    <form id="forgotForm">
      <div class="form-group">
        <label>E-mail cadastrado</label>
        <input type="email" id="forgotEmail" required
          autocomplete="email" placeholder="seu@email.com">
      </div>

      <br>

      <button class="btn btn-primary" style="width:100%">
        📧 Enviar link de recuperação
      </button>

      <button type="button" class="btn btn-secondary auth-back"
        onclick="showLogin()">
        ← Voltar para o login
      </button>
    </form>
  `;

  document.getElementById("forgotForm")
    .addEventListener("submit", handleForgotSubmit);
}

async function handleForgotSubmit(event){
  event.preventDefault();

  const email = document.getElementById("forgotEmail").value.trim();

  try{
    showLoading(true);

    const {error} = await supabaseClient.auth.resetPasswordForEmail(
      email,
      {redirectTo:publicRedirectUrl()}
    );

    if(error) throw error;

    showToast(
      "Se o e-mail estiver cadastrado, o link de recuperação foi enviado.",
      "success"
    );

    document.getElementById("forgotForm").reset();

  }catch(error){
    console.error(error);
    showToast(
      error.message || "Não foi possível enviar o link de recuperação.",
      "error"
    );
  }finally{
    showLoading(false);
  }
}

function showSignup(){
  document.getElementById("authSubtitle").textContent =
    "Novo cadastro";

  document.getElementById("authContent").innerHTML = `
    <div class="auth-note">
      O cadastro público cria inicialmente um usuário com perfil
      <strong>Aluno</strong>. Depois da confirmação do e-mail, o acesso
      poderá ser liberado conforme as regras do sistema.
    </div>

    <form id="signupForm">

      <div class="form-group">
        <label>Nome completo</label>
        <input type="text" id="signupNome" required
          autocomplete="name" placeholder="Seu nome completo">
      </div>

      <br>

      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="signupEmail" required
          autocomplete="email" placeholder="seu@email.com">

          placeholder="Mínimo de 6 caracteres">

        <label>Confirmar senha</label>
        <input type="password" id="signupPassword2" required

          placeholder="Digite a senha novamente">
      </div>

      <br>

      <button class="btn btn-primary" style="width:100%">

      </button>

      <button type="button" class="btn btn-secondary auth-back"
        onclick="showLogin()">

      </button>

    </form>
  `;

  document.getElementById("signupForm")

}

async function handleSignupSubmit(event){
  event.preventDefault();

  const nome = document.getElementById("signupNome").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const password = document.getElementById("signupPassword").value;
  const password2 = document.getElementById("signupPassword2").value;

  if(password !== password2){
    showToast("As senhas não conferem.","error");
    return;
  }

  try{
    showLoading(true);

    /*
     * O Supabase pode retornar um usuário sem identities quando
     * o e-mail já existe. Nesse caso não tratamos como novo cadastro:
     * orientamos diretamente para a recuperação de senha.
     */
    const {data,error} = await supabaseClient.auth.signUp({
      email,
      password,
      options:{
        emailRedirectTo:publicRedirectUrl(),
        data:{
          nome,
          perfil:"ALUNO",
          ativo:true
        }
      }
    });

    if(error) throw error;

    if(!data.user){
      throw new Error("O Supabase não retornou o usuário.");
    }

    if(Array.isArray(data.user.identities) &&
       data.user.identities.length === 0){

      showToast(
        "Este e-mail já possui cadastro. Use 'Esqueci minha senha' para recuperar o acesso.",
        "error"
      );

      showForgotPassword();

      const input = document.getElementById("forgotEmail");
      if(input) input.value = email;

      return;
    }

    /*
     * Se a confirmação de e-mail estiver desativada e houver sessão,
     * podemos criar o perfil imediatamente. Com confirmação ativada,
     * a criação do perfil deve ser feita por trigger no Supabase,
     * usando os dados enviados acima.
     */
    if(data.session){
      const {error:profileError} = await supabaseClient
        .from("profiles")
        .upsert({
          id:data.user.id,
          nome,
          email,
          perfil:"ALUNO",
          ativo:true
        },{onConflict:"id"});

      if(profileError){
        console.error("Perfil:",profileError);
      }
    }

    showLogin();

    showToast(
      "Cadastro iniciado. Verifique seu e-mail para confirmar a conta.",
      "success"
    );

  }catch(error){
    console.error(error);

    const msg = String(error.message || "").toLowerCase();

    if(
      msg.includes("already registered") ||
      msg.includes("already exists") ||
      msg.includes("user already")
    ){
      showForgotPassword();

      const input = document.getElementById("forgotEmail");
      if(input) input.value = email;

      showToast(
        "Este e-mail já possui cadastro. Use a recuperação de senha.",
        "error"
      );
    }else{
      showToast(
        error.message || "Não foi possível realizar o cadastro.",
        "error"
      );
    }
  }finally{
    showLoading(false);
  }
}

/* =========================================================
   CARREGAMENTO DO BANCO
   ========================================================= */

async function loadDatabase(){

  const [
    profiles,
    turmas,
    matriculas,
    aulas,
    atividades,
    frequencias
  ] = await Promise.all([

    supabaseClient
      .from("profiles")
      .select("*")
      .order("nome"),

    supabaseClient
      .from("turmas")
      .select("*")
      .order("nome"),

    supabaseClient
      .from("matriculas")
      .select("*")
      .order("id"),

    supabaseClient
      .from("aulas")
      .select("*")
      .order("data_aula")
      .order("hora_inicio"),

    supabaseClient
      .from("atividades")
      .select("*")
      .order("created_at",{ascending:false}),

    supabaseClient
      .from("frequencias")
      .select("*")
      .order("created_at",{ascending:false})

  ]);

  const results = [
    profiles,
    turmas,
    matriculas,
    aulas,
    atividades,
    frequencias
  ];

  for(const result of results){

    if(result.error){
      throw result.error;
    }
  }

  db = {
    profiles:profiles.data || [],
    turmas:turmas.data || [],
    matriculas:matriculas.data || [],
    aulas:aulas.data || [],
    atividades:atividades.data || [],
    frequencias:frequencias.data || []
  };
}

async function loadApplication(){

  showLoading(true);

  try{

    await loadCurrentProfile();
    await loadDatabase();

    document.getElementById("loginScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    renderHeader();
    renderNavigation();

    await renderPage();

  }catch(error){

    console.error(error);

    showToast(
      error.message || "Erro ao carregar o sistema.",
      "error"
    );

    document.getElementById("app").classList.add("hidden");
    document.getElementById("loginScreen").classList.remove("hidden");

  }finally{

    showLoading(false);
  }
}

async function saveUser(event,id){

  event.preventDefault();

  const nome =
    document.getElementById("userNome").value.trim();

  const email =
    document.getElementById("userEmail").value.trim();

  const perfil =
    document.getElementById("userPerfil").value;

  const funcao =
    document.getElementById("userFuncao").value.trim();

  try{

    showLoading(true);

    if(id){

      const {error} =
        await supabaseClient
          .from("profiles")
          .update({
            nome,
            perfil,
            funcao:funcao || null
          })
          .eq("id",id);

      if(error) throw error;

      showToast("Usuário atualizado.","success");

    }else{

      const senha =
        document.getElementById("userSenha").value;

      /*
       * Cliente separado para não substituir
       * a sessão do administrador.
       */

      const temporaryClient = createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY,
        {
          auth:{
            persistSession:false,
            autoRefreshToken:false
          }
        }
      );

      const {data,error} =
        await temporaryClient.auth.signUp({
          email,
          password:senha
        });

      if(error) throw error;

      if(!data.user){
        throw new Error(
          "O Supabase não retornou o usuário criado."
        );
      }

      const {error:profileError} =
        await supabaseClient
          .from("profiles")
          .insert({
            id:data.user.id,
            nome,
            email,
            perfil,
            funcao:funcao || null,
            ativo:true
          });

      if(profileError){

        throw new Error(
          "Usuário Auth criado, mas não foi possível criar o perfil: " +
          profileError.message
        );
      }

      showToast("Usuário criado.","success");
    }

    closeModal();

    await loadDatabase();

    renderUsuarios();

  }catch(error){

    console.error(error);

    showToast(
      error.message || "Erro ao salvar usuário.",
      "error"
    );

  }finally{

    showLoading(false);
  }
}

async function toggleUserStatus(id,status){

  if(id === currentProfile.id){

    showToast(
      "Você não pode desativar seu próprio usuário.",
      "error"
    );

    return;
  }

  if(!confirm(
    status
    ? "Deseja ativar este usuário?"
    : "Deseja desativar este usuário?"
  )){
    return;
  }

  try{

    const {error} =
      await supabaseClient
        .from("profiles")
        .update({ativo:status})
        .eq("id",id);

    if(error) throw error;

    await loadDatabase();

    renderUsuarios();

    showToast(
      status ? "Usuário ativado.":"Usuário desativado.",
      "success"
    );

  }catch(error){

    showToast(error.message,"error");
  }
}

async function saveTurma(event,id){

  event.preventDefault();

  const payload = {

    nome:
      document.getElementById("turmaNome").value.trim(),

    descricao:
      document.getElementById("turmaDescricao").value.trim() || null,

    coordenador_id:
      document.getElementById("turmaCoordenador").value || null,

    instrutor_id:
      document.getElementById("turmaInstrutor").value || null
  };

  try{

    let result;

    if(id){

      result =
        await supabaseClient
          .from("turmas")
          .update(payload)
          .eq("id",id);

    }else{

      result =
        await supabaseClient
          .from("turmas")
          .insert({
            ...payload,
            ativo:true
          });
    }

    if(result.error) throw result.error;

    closeModal();

    await loadDatabase();

    renderTurmas();

    showToast("Turma salva.","success");

  }catch(error){

    showToast(error.message,"error");
  }
}

async function toggleMatricula(turmaId,alunoId,checked){

  try{

    const existing =
      db.matriculas.find(m =>
        String(m.turma_id) === String(turmaId) &&
        m.aluno_id === alunoId
      );

    if(checked){

      if(existing){

        const {error} =
          await supabaseClient
            .from("matriculas")
            .update({ativo:true})
            .eq("id",existing.id);

        if(error) throw error;

      }else{

        const {error} =
          await supabaseClient
            .from("matriculas")
            .insert({
              turma_id:turmaId,
              aluno_id:alunoId,
              data_matricula:todayISO(),
              ativo:true
            });

        if(error) throw error;
      }

    }else{

      if(existing){

        const {error} =
          await supabaseClient
            .from("matriculas")
            .update({ativo:false})
            .eq("id",existing.id);

        if(error) throw error;
      }
    }

    await loadDatabase();

    showToast(
      checked
      ? "Aluno matriculado."
      : "Matrícula desativada.",
      "success"
    );

  }catch(error){

    showToast(error.message,"error");
  }
}

async function saveActivity(event,aulaId){

  event.preventDefault();

  const funcao =
    document.getElementById("atividadeFuncao").value.trim();

  const descricao =
    document.getElementById("atividadeDescricao").value.trim();

  const horas =
    Number(document.getElementById("atividadeHoras").value);

  if(!funcao || !descricao || !horas){

    showToast(
      "Preencha todos os campos.",
      "error"
    );

    return;
  }

  try{

    /*
     * Segunda verificação contra duplicidade.
     */

    const {data:existing,error:checkError} =
      await supabaseClient
        .from("atividades")
        .select("id")
        .eq("aula_id",aulaId)
        .eq("aluno_id",currentProfile.id)
        .maybeSingle();

    if(checkError) throw checkError;

    if(existing){

      showToast(
        "Esta atividade já foi registrada.",
        "error"
      );

      closeModal();

      return;
    }

    const {error} =
      await supabaseClient
        .from("atividades")
        .insert({
          aula_id:aulaId,
          aluno_id:currentProfile.id,
          funcao,
          descricao,
          horas,
          status:"PENDENTE"
        });

    if(error) throw error;

    closeModal();

    await loadDatabase();

    renderAtividades();

    showToast(
      "Atividade registrada com sucesso. A edição está bloqueada.",
      "success"
    );

  }catch(error){

    console.error(error);

    showToast(
      error.message,
      "error"
    );
  }
}

async function setAttendance(
  aulaId,
  alunoId,
  presente
){

  try{

    const existing =
      db.frequencias.find(f =>
        f.aula_id === aulaId &&
        f.aluno_id === alunoId
      );

    if(existing){

      const {error} =
        await supabaseClient
          .from("frequencias")
          .update({
            presente,
            registrado_por:currentProfile.id
          })
          .eq("id",existing.id);

      if(error) throw error;

    }else{

      const {error} =
        await supabaseClient
          .from("frequencias")
          .insert({
            aula_id:aulaId,
            aluno_id:alunoId,
            presente,
            registrado_por:currentProfile.id
          });

      if(error) throw error;
    }

    await loadDatabase();

    openAttendance(aulaId);

    showToast(
      presente
      ? "Aluno marcado como presente."
      : "Ausência registrada.",
      "success"
    );

  }catch(error){

    console.error(error);

    showToast(
      error.message,
      "error"
    );
  }
}

function exportBackup(){

  const backup = {

    exported_at:new Date().toISOString(),

    profiles:db.profiles,

    turmas:db.turmas,

    matriculas:db.matriculas,

    aulas:db.aulas,

    atividades:db.atividades,

    frequencias:db.frequencias

  };

  const blob =
    new Blob(
      [JSON.stringify(backup,null,2)],
      {type:"application/json"}
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;

  link.download =
    `backup-comunicatec-${todayISO()}.json`;

  link.click();

  URL.revokeObjectURL(url);

  showToast(
    "Backup exportado.",
    "success"
  );
}

/* =========================================================

   ========================================================= */

supabaseClient.auth.onAuthStateChange(
  async (event,newSession) => {

    if(event === "PASSWORD_RECOVERY"){
      session = newSession;
      showPasswordRecovery();
      showLoading(false);
      return;
    }

    if(event === "SIGNED_OUT"){
      session = null;
      currentProfile = null;
      showLogin();
      showLoading(false);
      return;
    }

    /*
     * Não abrimos o sistema automaticamente durante o retorno
     * de recuperação. O evento PASSWORD_RECOVERY cuida daquela tela.
     */
    if(newSession && !currentProfile && event !== "PASSWORD_RECOVERY"){
      session = newSession;

      try{
        await loadApplication();
      }catch(error){
        console.error(error);
      }
    }
  }
);

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

async function initialize(){

  showLoading(true);

  try{

    /*
     * Se o Supabase devolveu a aplicação por um link de recuperação,
     * exibimos o formulário de nova senha em vez da tela de login.
     */
    const hash = window.location.hash || "";
    const search = window.location.search || "";

    const recoveryUrl =
      hash.includes("type=recovery") ||
      search.includes("type=recovery");

    const {data,error} =
      await supabaseClient.auth.getSession();

    if(error) throw error;

    session = data.session;

    if(recoveryUrl){
      if(session){
        showPasswordRecovery();
      }else{
        showLogin();
        showToast(
          "O link de recuperação expirou ou é inválido. Solicite um novo link.",
          "error"
        );
      }
      return;
    }

    if(session){
      await loadApplication();
    }else{
      showLogin();
    }

  }catch(error){

    console.error(error);

    showLogin();

    showToast(
      error.message ||
      "Não foi possível iniciar o sistema.",
      "error"
    );

  }finally{

    showLoading(false);
  }
}
